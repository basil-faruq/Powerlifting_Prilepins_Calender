# Alembic configuration. Every target runs from `backend/`, so the paths here
# are relative to that directory.
#
# `sqlalchemy.url` is deliberately absent. The URL is resolved in
# `migrations/env.py` from `get_settings().database_url`, which keeps the
# database password out of a committed file and leaves exactly one place where
# the URL is decided. `tests/conftest.py` overrides it in-process via
# `config.set_main_option` to point at `planner_test`.

[alembic]
script_location = migrations
prepend_sys_path = .
# `path_separator`, not the older `version_path_separator`: Alembic 1.20
# deprecates the latter and warns that it falls back to splitting on spaces,
# commas and colons.
path_separator = os

# `%%` escapes ConfigParser interpolation. With hand-assigned revision ids this
# yields the filenames spec 02 §8 names: 0001_init.py, 0002_seed_lifts.py.
file_template = %%(rev)s_%%(slug)s

# No `timezone` setting: Alembic resolves it through zoneinfo, which on Windows
# needs the `tzdata` package, and spec 02 adds no dependencies.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
