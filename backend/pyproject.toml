[project]
name = "powerlifting-planner-backend"
version = "0.1.0"
description = "Powerlifting Block Planner — backend (planner_core engine, strength domain, FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    # Tracing (spec 14). `langfuse` is OpenTelemetry-based and brings the SDK
    # with it; `planner_core/tracing.py` imports only the *API*, so the
    # declaration is explicit rather than left transitive through pydantic-ai.
    "langfuse>=3",
    "opentelemetry-api>=1.30",
    # Was only transitive (via ortools); the simulator samples and takes
    # percentiles with it directly (spec 10), so it is declared.
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[anthropic,openai]>=2",
    "pydantic-settings>=2.15.0",
    # Starlette parses multipart bodies through this; without it an UploadFile
    # route raises at import. Needed by POST /templates/import (spec 06).
    "python-multipart>=0.0.20",
    # Reads tests/fixtures/router_cases.yaml in scripts/eval_router.py (spec 13).
    # Was only transitive via uvicorn[standard]; the eval script imports it.
    "pyyaml>=6",
    # Discrete-event engine behind the Monte-Carlo simulator (spec 10).
    "simpy>=4.1",
    "sqlmodel>=0.0.48",
    # Durable execution for the block workflow (spec 15): one BlockWorkflow per
    # block, alive for the whole 11 weeks. The base package is deliberate -- the
    # `[opentelemetry]` extra would put an OTel import under domains/, which
    # tests/test_tracing.py forbids. Spans reach Langfuse through
    # planner_core.tracing as everywhere else.
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Not an installable package: planner_core / domains / api are imported from this
# directory, not built into a wheel. Nothing imports the project by name.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# Spec 15's workflow tests are the first async tests in the suite. `strict` is
# the state the project has always run in (the key was simply unset), so saying
# it out loud changes nothing: every other async path is driven by
# `asyncio.run(...)` and must keep being collected as a plain sync test. The
# loop scope is pinned only to silence pytest-asyncio's unset-default warning.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures shadow their own names by design.
"tests/*" = ["B008"]
# `Query(...)` and `File(...)` in a default *is* the FastAPI idiom: the call is
# how a parameter is described to OpenAPI, and it is evaluated once at import,
# which is the mutable-default trap B008 exists to catch and this is not.
"api/routes/*" = ["B008"]

[dependency-groups]
dev = [
    # Streams the OpenPowerlifting CSV in scripts/calibrate_simulator.py only.
    "polars>=1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
